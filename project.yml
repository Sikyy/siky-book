name: YiYue
options:
  bundleIdPrefix: com.siky
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  Nuke:
    url: https://github.com/kean/Nuke.git
    from: "13.0.0"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.7.0"
targets:
  YiYue:
    type: application
    platform: iOS
    sources:
      - path: YiYue
    info:
      path: YiYue/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 已阅
        BGTaskSchedulerPermittedIdentifiers:
          - "$(PRODUCT_BUNDLE_IDENTIFIER).chapter-cache.user"
          - "$(PRODUCT_BUNDLE_IDENTIFIER).chapter-cache.resume"
        UIBackgroundModes:
          - processing
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        CFBundleDocumentTypes:
          - CFBundleTypeName: Text File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mistyislet.yiyue
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
    dependencies:
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: SwiftSoup
  YiYueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YiYueTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: YiYue
