<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今日已阅 — 用你自己的书源读小说</title>
<meta name="description" content="今日已阅是一个中文小说阅读器：导入书源后按书名搜书，也能直接读手机里的 txt 和 epub，章节可以存到本机离线阅读。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="wrap">

  <section class="hero">
    <div>
      <p class="eyebrow">中文小说阅读器 · iPhone</p>
      <h1>用你自己的书源，读完整本书</h1>
      <p class="lede">导入书源后按书名搜书，也能直接读手机里的 txt 和 epub。章节可以缓存（存到本机，断网也能看）。</p>
      <p class="status">即将登陆 App Store</p>
    </div>
    <p class="mark">今日已阅</p>
  </section>

  <section class="features">
    <div class="feature">
      <h2>自备书源</h2>
      <p>导入书源地址或文件，按书名搜索。每本书列出所有书源，点开哪个由你定。</p>
    </div>
    <div class="feature">
      <h2>本地书直接读</h2>
      <p>txt 自动识别编码并分章；epub 取出书名、作者、封面和目录。</p>
    </div>
    <div class="feature">
      <h2>章节缓存到本机</h2>
      <p>缓存接下来的章节，地铁和飞机上没有网也能接着读。</p>
    </div>
    <div class="feature">
      <h2>阅读页自己调</h2>
      <p>纸质、白色、夜间三种主题，字号、行距、边距都能改；书签和笔记随手加。</p>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <p>© 2026 今日已阅</p>
    <nav aria-label="页脚">
      <a href="support/">支持</a>
      <a href="privacy/">隐私政策</a>
    </nav>
  </div>
</footer>

</body>
</html>
